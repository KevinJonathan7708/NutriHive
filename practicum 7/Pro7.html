<head>
    <meta charset="UTF-8">

    <title>Food Gallery</title>
    <style>
        body {
            margin: 0px;
            padding: 24px;
            font: 16px Arial, sans-serif;
            color: #18352d;
            background: #fffdf4;
        }

        nav {
            position: sticky;
            top: 0px;
            display: flex;
            align-items: center;
            gap: 4px;
            margin: 12px;
            padding: 4px 8px;
            background: #f4e6a2;
            border-radius: 12px;
            box-shadow: 0px 4px 10px 0px #18352d;
        }

        nav a {
            display: block;
            padding: 10px 14px;
            border-radius: 8px;
            color: #18352d;
            text-decoration: none;
        }

        nav a:hover { background: #e8cf69; }
        .appointment { margin-left: auto; }

        h1 { text-align: center; }
        hr { border: 1px solid #e8cf69; }

        .gallery {
            display: grid;
            grid-template-columns: 250px 250px 250px 250px;
            gap: 16px;
            max-width: 1100px;
            margin: 24px auto;
            justify-content: center;
        }

        figure {
            margin: 0px;
            padding: 8px;
            background: #f4e6a2;
            border-radius: 10px;
        }

        img {
            display: block;
            width: 234px;
            height: 220px;
            object-fit: cover;
            border-radius: 6px;
        }

        figcaption { padding: 8px 2px 2px; }

        @media (max-width: 520px) {
            body { padding: 12px; }
            nav { margin: 8px 0px; padding: 4px; }
            .appointment { margin-left: 0px; }
        }

        @media (max-width: 563px) {
            .gallery { grid-template-columns: 250px; }
            img { height: 180px; }
        }

        @media (min-width: 564px) and (max-width: 1095px) {
            .gallery { grid-template-columns: 250px 250px; }
        }
    </style>
