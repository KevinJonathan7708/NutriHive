<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NutriHive Navigation Menu</title>
    <style>
        body { 
            margin: 0px; 
            font: 16px Arial, sans-serif; 
            color: #18352d; 
            background: #fffdf4; 
        }

        nav { 
            display: flex; 
            flex-wrap: wrap; 
            align-items: center; 
            gap: 4px; 
            margin: 12px; 
            padding: 4px 8px; 
            background: #f4e6a2; 
            border-radius: 12px; 
        }

        nav a { 
            display: block; 
            padding: 10px 14px; 
            border-radius: 8px; 
            color: #18352d; 
            text-decoration: none; 
        }

        nav a:hover, nav a:focus { 
            background: #e8cf69; 
        }

        .dropdown { 
            position: relative; 
        }

        .dropdown-label::after { 
            content: " ▾"; 
        }

        .dropdown-menu { 
            display: none; 
            position: absolute; 
            top: 40px; 
            left: 0px; 
            min-width: 140px; 
            flex-direction: column; 
            background: #f4e6a2; 
            border-radius: 8px; 
            box-shadow: 0px 4px 8px rgba(0,0,0,0.15); 
            z-index: 1; 
        }

        .dropdown-menu a { 
            white-space: nowrap; 
        }

        .dropdown:hover .dropdown-menu, 
        .dropdown:focus-within .dropdown-menu { 
            display: flex; 
        }

        .appointment { 
            margin-left: auto; 
        }

        @media (max-width: 520px) { 
            nav { margin: 8px; padding: 4px; } 
            .appointment { margin-left: 0px; } 
        }
    </style>
</head>
<body>
    <nav aria-label="Main navigation">

                <a href="../practicum%2014/index.html#chart">Diet Chart</a>
            </div>
        </div>

        <div class="dropdown">
            <a class="dropdown-label" href="../practicum%2014/index.html#business">Business</a>
            <div class="dropdown-menu">
                <a href="../practicum%2014/index.html#business">Business Inquiries</a>
                <a href="../practicum%2014/index.html#partnerships">Partnership Opportunities</a>
            </div>
        </div>

        <div class="dropdown">
            <a class="dropdown-label" href="../practicum%2014/index.html#advertise">Advertising</a>
            <div class="dropdown-menu">
                <a href="../practicum%2014/index.html#advertise">Advertise With Us</a>
                <a href="../practicum%2014/index.html#sponsorship">Sponsorships</a>
            </div>
        </div>

        <a href="../practicum%2014/index.html#location">Clinic</a>

    </nav>
</body>
</html>
